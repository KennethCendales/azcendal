<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azcendal | Ropa Deportiva</title>
  <meta name="description" content="Azcendal — ropa deportiva de alto rendimiento. Colecciones Hombre y Mujer.">
  <link rel="icon" href="assets/logo.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/estilos.css">
</head>
<body>

  <header class="site-header">
    <nav class="nav-principal" aria-label="Navegación principal">
      <ul>
        <li class="dropdown">
          <button class="nav-link" aria-expanded="false" aria-haspopup="true">
            HOMBRE <span class="chevron" aria-hidden="true">▾</span>
          </button>
          <ul class="dropdown-menu">
            <li><a href="#">Camisetas</a></li>
            <li><a href="#">Chaquetas</a></li>
            <li><a href="#">Pantalones</a></li>
            <li><a href="#">Calzado</a></li>
          </ul>
        </li>
        <li class="dropdown">
          <button class="nav-link" aria-expanded="false" aria-haspopup="true">
            MUJER <span class="chevron" aria-hidden="true">▾</span>
          </button>
          <ul class="dropdown-menu">
            <li><a href="#">Tops</a></li>
            <li><a href="#">Leggings</a></li>
            <li><a href="#">Chaquetas</a></li>
            <li><a href="#">Calzado</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <a href="#" class="logo" aria-label="Azcendal, ir al inicio">
      <img src="assets/nombre_marca.png" alt="Azcendal">
    </a>

    <div class="acciones-header">
      <div class="dropdown idioma">
        <button class="nav-link" aria-expanded="false" aria-haspopup="true">
          ESPAÑOL <span class="chevron" aria-hidden="true">▾</span>
        </button>
        <ul class="dropdown-menu dropdown-menu--derecha">
          <li><a href="#">Español</a></li>
          <li><a href="#">English</a></li>
        </ul>
      </div>
      <a href="#" class="icono" aria-label="Mi cuenta">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-9 2.2-9 5.5V22h18v-2.5c0-3.3-4.6-5.5-9-5.5Z" fill="currentColor"/></svg>
      </a>
      <button class="icono" aria-label="Buscar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z" fill="currentColor"/></svg>
      </button>
      <a href="#" class="icono" aria-label="Carrito de compras">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12L6 6Zm0 0-1-3H2m6 19a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm10 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </header>

  <main>
    <section class="hero" aria-label="Colecciones destacadas">

      <a href="#" class="hero-panel hero-panel--hombre">
        <img src="assets/hombre.png" alt="Modelo hombre con chaqueta deportiva negra Azcendal, vista de espalda" class="hero-img">
        <span class="hero-panel__cta">
          <span class="boton">COMPRAR HOMBRE</span>
        </span>
      </a>

      <div class="hero-seam" aria-hidden="true"></div>

      <a href="#" class="hero-panel hero-panel--mujer">
        <img src="assets/mujer.png" alt="Modelo mujer sosteniendo un balón medicinal, con top y leggings deportivos Azcendal" class="hero-img">
        <span class="hero-panel__cta">
          <span class="boton">COMPRAR MUJER</span>
        </span>
      </a>

    </section>
  </main>

</body>
</html>
